name: Research status app
on:
  pull_request:
    paths: ['apps/research-status/**', 'research/program/AGENDA.md', 'research/LEDGER.md', '.github/workflows/research-status.yml']
  push:
    branches: [main]
    paths: ['apps/research-status/**', 'research/program/AGENDA.md', 'research/LEDGER.md', '.github/workflows/research-status.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run build && npm test
        working-directory: apps/research-status
