[package]
name = "hard-ladder"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Hard-instance ladder (n = 6..10, Owen colour counts): node-counted exact-search comparison harness."

# Standalone workspace so the crate builds from a clean checkout on its own.
[workspace]

[lib]
name = "hard_ladder"
path = "src/lib.rs"

[[bin]]
name = "hard_ladder"
path = "src/main.rs"

[dependencies]
eternity2-engine = { path = "../../../../engine" }
bench-grid = { path = "../../single-core-benchmark/engine/crates/bench-grid" }
eternity2-core = { path = "../../single-core-benchmark/engine/crates/core" }
eternity2-events = { path = "../../single-core-benchmark/engine/crates/events" }
eternity2-solver-trait = { path = "../../single-core-benchmark/engine/crates/solver-trait" }
eternity2-solver-engine = { path = "../../single-core-benchmark/engine/crates/solver-engine" }
eternity2-solver-naive = { path = "../../single-core-benchmark/engine/crates/solver-naive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
