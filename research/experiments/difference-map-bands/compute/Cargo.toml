[package]
name = "difference-map-bands"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Divide-and-concur difference map for edge matching with exact k-row band projections (track 11, 2026-11-12)."

# Standalone workspace so the crate builds from a clean checkout on its own.
[workspace]

[[bin]]
name = "dmb"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
