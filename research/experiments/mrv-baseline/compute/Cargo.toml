[package]
name = "mrv-baseline"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "A22: bb-mrv as a hard-ladder baseline, scaling of the node ratio, ablations."

# Standalone workspace so the crate builds from a clean checkout on its own.
[workspace]
members = ["engine-fork"]

[[bin]]
name = "mrv_baseline"
path = "src/main.rs"

[dependencies]
hard-ladder = { path = "../../hard-ladder/compute" }
backdoor-branching = { path = "../../backdoor-branching/compute" }
sat-backdoors = { path = "../../sat-backdoors" }
eternity2-engine = { path = "../../../../engine" }
mrvb-solver-engine = { path = "engine-fork" }
bench-grid = { path = "../../single-core-benchmark/engine/crates/bench-grid" }
eternity2-events = { path = "../../single-core-benchmark/engine/crates/events" }
eternity2-solver-trait = { path = "../../single-core-benchmark/engine/crates/solver-trait" }
eternity2-solver-engine = { path = "../../single-core-benchmark/engine/crates/solver-engine" }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
