[package]
name = "ktam-unassignment"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "A15: non-chronological, bond-weighted unassignment (kTAM detachment, IMS eviction) on the hard-ladder harness."
default-run = "ktam"

# Standalone workspace so the crate builds from a clean checkout on its own.
[workspace]

[lib]
name = "ktam"
path = "src/lib.rs"

[[bin]]
name = "ktam"
path = "src/main.rs"

[dependencies]
eternity2-engine = { path = "../../../../engine" }
hard-ladder = { path = "../../hard-ladder/compute" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
