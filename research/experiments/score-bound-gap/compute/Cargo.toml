[package]
name = "score-bound-gap"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Stage 0 of a score bound for break-tolerant DFS: gap of a width-W relaxed decision diagram against the exact best completion."

# Standalone workspace so the crate builds from a clean checkout on its own.
[workspace]

[lib]
name = "sbg"
path = "src/lib.rs"

[[bin]]
name = "sbg"
path = "src/main.rs"

[dependencies]
eternity2-engine = { path = "../../../../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
