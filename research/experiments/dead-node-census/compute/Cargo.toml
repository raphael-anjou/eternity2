[package]
name = "dead-node-census"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Night 2026-11-12 track 6: dead-node refutation census on bb-mrv trees (measurement)."

# Standalone workspace so the crate builds from a clean checkout on its own.
[workspace]

[[bin]]
name = "census"
path = "src/main.rs"

[dependencies]
hard-ladder = { path = "../../hard-ladder/compute" }
backdoor-branching = { path = "../../backdoor-branching/compute" }
sat-backdoors = { path = "../../sat-backdoors" }
eternity2-engine = { path = "../../../../engine" }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
