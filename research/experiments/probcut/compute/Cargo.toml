[package]
name = "probcut"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "ProbCut statistical cutoffs on a forward-checked row-major DFS, run on the hard-ladder harness."
default-run = "probcut"

# Standalone workspace so the crate builds from a clean checkout on its own.
[workspace]

[lib]
name = "probcut"
path = "src/lib.rs"

[[bin]]
name = "probcut"
path = "src/main.rs"

[dependencies]
eternity2-engine = { path = "../../../../engine" }
hard-ladder = { path = "../../hard-ladder/compute" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
