[package]
name = "baseline-tournament"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Track 5 (2026-11-12): every solver-like component on R6, R7 and 8x8 c=10 through the hard-ladder NodeCounter."

# Standalone workspace so the crate builds from a clean checkout on its own.
[workspace]

[[bin]]
name = "tournament"
path = "src/main.rs"

[dependencies]
hard-ladder = { path = "../../hard-ladder/compute" }
mrv-baseline = { path = "../../mrv-baseline/compute" }
mrvb-solver-engine = { path = "../../mrv-baseline/compute/engine-fork" }
backdoor-branching = { path = "../../backdoor-branching/compute" }
probcut = { path = "../../probcut/compute" }
ktam-unassignment = { path = "../../ktam-unassignment/compute" }
cmp-solver-engine = { path = "../../cut-multiset-pruning/compute/engine-fork" }
eternity2-solver-trait = { path = "../../single-core-benchmark/engine/crates/solver-trait" }
eternity2-solver-engine = { path = "../../single-core-benchmark/engine/crates/solver-engine" }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
